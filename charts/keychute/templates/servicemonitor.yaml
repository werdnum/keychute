{{- if .Values.serviceMonitor.enabled }}
# Scrapes the server's metrics over the same TLS listener as everything else
# (there is no plaintext port). Requires the Prometheus operator CRDs.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "keychute.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "keychute.labels" . | nindent 4 }}
spec:
  endpoints:
    - port: https
      path: {{ .Values.serviceMonitor.path | quote }}
      scheme: {{ .Values.serviceMonitor.scheme | quote }}
      interval: {{ .Values.serviceMonitor.interval }}
      tlsConfig:
        {{- toYaml .Values.serviceMonitor.tlsConfig | nindent 8 }}
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
  selector:
    matchLabels:
      {{- include "keychute.selectorLabels" . | nindent 6 }}
{{- end }}
