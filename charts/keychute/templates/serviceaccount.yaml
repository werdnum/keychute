{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keychute.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "keychute.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.imagePullSecrets }}
# ghcr-secret is mirrored into all namespaces out-of-band (emberstack reflector
# in the reference cluster); conftest enforces that it is referenced.
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
