[workspace]
resolver = "2"
members = ["types", "server", "cli", "e2e"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/werdnum/keychute"

[workspace.dependencies]
# runtime
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "set-header"] }
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rustls = { version = "0.23", features = ["ring"] }
# db
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
# crypto
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
base64 = "0.22"
# serde & misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
maud = "0.26"
jsonwebtoken = "9"
url = "2"
async-trait = "0.1"
futures = "0.3"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
