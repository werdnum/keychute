[package]
name = "keychute-e2e"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
keychute-types = { path = "../types" }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
tempfile = "3"
futures = { workspace = true }
# TLS fake upstream: the proxy only speaks https to origins, so the harness
# serves its recording upstream over TLS with a self-signed cert.
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
# Both ring and aws-lc-rs end up in the dep graph; pick one explicitly.
rustls = { workspace = true }
